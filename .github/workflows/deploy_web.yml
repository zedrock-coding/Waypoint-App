name: Deploy Helm Web to Vercel

on:
  push:
    branches:
      - highest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the code
      - uses: actions/checkout@v3

      # 2. Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. Handle Environment Variables
      # We create the .env file for local asset fallback AND use --dart-define for web stability
      - name: Create .env file
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > helm/.env

      # 4. Build the Web App
      - name: Build Web
        working-directory: ./helm
        run: |
          flutter pub get
          flutter build web --release --base-href "/" --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          # Ensure vercel.json is in the build directory for routing rules
          cp vercel.json build/web/

      # 5. Deploy to Vercel
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        run: vercel deploy helm/build/web --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
