name: Quality Gate

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helm
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  no-committed-secrets:
    name: No secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The .env asset removal is only durable if something fails when it comes
      # back. `git ls-files` checks what is actually committed, not the working
      # tree (where a developer's local .env legitimately lives).
      - name: Tracked env files must not exist
        run: |
          set -euo pipefail
          pattern='(^|/)\.env$|(^|/)\.env\.local$'
          if git ls-files | grep -qE "$pattern"; then
            echo "::error::A .env file is tracked. It must stay untracked (use .env.example)."
            git ls-files | grep -E "$pattern"
            exit 1
          fi

      - name: No credential-shaped strings in source
        run: |
          set -euo pipefail
          if git grep -nIiE 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|sb_secret_' \
               -- . ':!*.lock' ':!docs/*' ':!*.md'; then
            echo "::error::A credential-shaped string was found in the source tree."
            exit 1
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # Full history so the gate also catches secrets committed and later
      # removed from the working tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
