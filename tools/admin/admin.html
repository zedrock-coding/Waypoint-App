<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helm Feedback Dashboard</title>
    <!-- Use a specific version to ensure stability -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/umd/supabase.js"></script>
    <style>
        :root {
            --bg-color: #1A1C1E;
            --surface-color: #2D2F31;
            --primary-color: #88C0A4;
            --text-color: #FFFFFF;
            --text-secondary: #A0A2A4;
            --error-color: #FF6B6B;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 40px;
        }

        .auth-panel {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 12px;
            margin: 0 auto 40px;
            max-width: 600px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: var(--bg-color);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        h1 { color: var(--primary-color); margin: 0; }

        .refresh-btn {
            background-color: var(--primary-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .feedback-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header { display: flex; justify-content: space-between; margin-bottom: 16px; }
        .name { font-weight: bold; font-size: 18px; color: var(--primary-color); }
        .date { font-size: 11px; color: var(--text-secondary); }
        .email { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; display: block; text-decoration: none; }
        .email:hover { text-decoration: underline; }
        .message { font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.9); white-space: pre-wrap; }

        .error-banner {
            background-color: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Feedback Dashboard</h1>
        <button class="refresh-btn" onclick="fetchFeedback()">REFRESH</button>
    </div>

    <div class="auth-panel">
        <label style="font-size: 12px; font-weight: bold;">SUPABASE SERVICE ROLE KEY</label>
        <input type="password" id="service-key" placeholder="Paste your service_role key here to bypass RLS">
        <p style="font-size: 11px; color: var(--text-secondary); margin-top: 8px;">
            Operator tool. Open this file locally from <code>tools/admin/</code> — it is not part of the
            Flutter web build and must never be deployed. Use the <b>service_role</b> key from your
            Supabase Project Settings &gt; API; it is held in memory only and never persisted.
        </p>
    </div>

    <div id="error-banner" class="error-banner"></div>
    <div id="loading" style="text-align: center; color: var(--text-secondary); margin-top: 40px;">Enter your key and click Refresh.</div>
    <div class="feedback-grid" id="feedback-grid"></div>

    <script>
        const supabaseUrl = 'https://eknzdxexfcfdmqvbyvxt.supabase.co';

        // Feedback rows are attacker-controlled (anyone can insert through the
        // public feedback form). Never interpolate them into innerHTML: build
        // DOM nodes and assign textContent so a malicious payload is rendered
        // as inert text instead of executing and stealing the service_role key.
        const EMAIL_PATTERN = /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/;

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined && text !== null) node.textContent = String(text);
            return node;
        }

        function renderCard(item) {
            const card = el('div', 'card');

            const header = el('div', 'card-header');
            header.appendChild(el('span', 'name', item.name || 'Anonymous'));
            header.appendChild(el(
                'span',
                'date',
                item.created_at ? new Date(item.created_at).toLocaleString() : 'unknown date',
            ));
            card.appendChild(header);

            const email = typeof item.email === 'string' ? item.email.trim() : '';
            if (email && EMAIL_PATTERN.test(email)) {
                const link = el('a', 'email', email);
                link.href = 'mailto:' + encodeURIComponent(email);
                card.appendChild(link);
            } else {
                card.appendChild(el('span', 'email', email || '(no email)'));
            }

            card.appendChild(el('div', 'message', item.message || '(empty message)'));
            return card;
        }

        async function fetchFeedback() {
            const serviceKey = document.getElementById('service-key').value.trim();
            const grid = document.getElementById('feedback-grid');
            const loading = document.getElementById('loading');
            const errorBanner = document.getElementById('error-banner');

            if (!serviceKey) {
                alert('Please enter your service_role key first.');
                return;
            }

            errorBanner.style.display = 'none';
            grid.innerHTML = '';
            loading.style.display = 'block';
            loading.innerText = 'Fetching from cloud...';

            try {
                // Initialize client with the provided key
                const client = typeof supabase !== 'undefined'
                    ? supabase.createClient(supabaseUrl, serviceKey, { auth: { persistSession: false } })
                    : null;

                if (!client) throw new Error('Supabase library failed to load. Check your internet connection.');

                const { data, error } = await client
                    .from('feedback')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                loading.style.display = 'none';

                if (data.length === 0) {
                    loading.innerText = 'No feedback entries found in database.';
                    loading.style.display = 'block';
                    return;
                }

                data.forEach(item => grid.appendChild(renderCard(item)));
            } catch (err) {
                loading.style.display = 'none';
                errorBanner.style.display = 'block';
                errorBanner.innerText = 'Fetch Failed: ' + (err.message || JSON.stringify(err));
                console.error(err);
            }
        }
    </script>
</body>
</html>
