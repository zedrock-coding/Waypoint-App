# gitleaks configuration for Helm.
#
# The only allowlisted path is the historical `helm/.env`, which was committed
# before the remediation work (commit 273bf39). That key is being revoked and
# the file is no longer tracked. Re-adding the file is blocked independently by
# the `no-committed-secrets` job in .github/workflows/quality.yml, so this
# allowlist cannot silently re-open the hole.
#
# Everything else is scanned with the default rule set. Once the key has been
# revoked *and* (optionally) purged from history, this allowlist can be deleted.
[extend]
useDefault = true

[allowlist]
description = "Historical helm/.env (key revoked; file untracked since 2026-10-28)"
paths = ['''^helm/\.env$''']
