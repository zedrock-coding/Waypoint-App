<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helm Feedback Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #1A1C1E;
            --surface-color: #2D2F31;
            --primary-color: #88C0A4;
            --text-color: #FFFFFF;
            --text-secondary: #A0A2A4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 40px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
        }

        .refresh-btn {
            background-color: var(--primary-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .feedback-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .name {
            font-weight: bold;
            font-size: 18px;
            color: var(--primary-color);
        }

        .date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .email {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: block;
        }

        .message {
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255,255,255,0.9);
            white-space: pre-wrap;
        }

        .loading {
            text-align: center;
            font-size: 18px;
            color: var(--text-secondary);
            margin-top: 100px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Feedback Dashboard</h1>
        <button class="refresh-btn" onclick="fetchFeedback()">REFRESH</button>
    </div>

    <div id="loading" class="loading">Loading feedback entries...</div>
    <div class="feedback-grid" id="feedback-grid"></div>

    <script>
        const supabaseUrl = 'https://eknzdxexfcfdmqvbyvxt.supabase.co';
        const supabaseKey = 'sb_publishable_fUoY96CXli7DwbZayu8pFQ_4yExvoJg';
        const supabase = supabasejs.createClient(supabaseUrl, supabaseKey);

        async function fetchFeedback() {
            const grid = document.getElementById('feedback-grid');
            const loading = document.getElementById('loading');

            grid.innerHTML = '';
            loading.style.display = 'block';

            const { data, error } = await supabase
                .from('feedback')
                .select('*')
                .order('created_at', { ascending: false });

            loading.style.display = 'none';

            if (error) {
                alert('Error fetching feedback: ' + error.message);
                return;
            }

            if (data.length === 0) {
                loading.innerText = 'No feedback entries yet.';
                loading.style.display = 'block';
                return;
            }

            data.forEach(item => {
                const date = new Date(item.created_at).toLocaleString();
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="name">${item.name}</span>
                        <span class="date">${date}</span>
                    </div>
                    <a href="mailto:${item.email}" class="email">${item.email}</a>
                    <div class="message">${item.message}</div>
                `;
                grid.appendChild(card);
            });
        }

        fetchFeedback();
    </script>
</body>
</html>
