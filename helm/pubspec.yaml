name: waypoint
description: "AI-orchestrated task management workspace"
publish_to: 'none'

version: 0.4.9+20

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  cupertino_icons: ^1.0.8
  file_picker: 8.1.7
  timezone: 0.9.0
  flutter_local_notifications: 17.2.3
  provider: ^6.1.5+1
  intl: ^0.19.0
  package_info_plus: ^9.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.6.0
  app_links: ^6.3.2
  uuid: ^4.4.0
  flutter_markdown: ^0.7.3
  speech_to_text: ^7.0.0
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  record: ^6.2.1
  flutter_timezone: ^5.1.1
  home_widget: ^0.10.0
  permission_handler: 11.3.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  windows:
    generate: true
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/EULA.md
    - assets/Privacy_policy.md
